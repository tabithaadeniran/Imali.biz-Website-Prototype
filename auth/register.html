<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>(function(){var t=localStorage.getItem('imali-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Imali.biz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body { display: flex; align-items: flex-start; justify-content: center; min-height: 100svh; padding: 6rem 1.5rem 3rem; }
    .auth-card {
      width: 100%; max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-md);
    }
    .auth-logo { display: flex; justify-content: center; margin-bottom: 2rem; }
    .auth-logo img { height: 36px; }
    .auth-title { font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 0.4rem; }
    .auth-sub { font-size: 0.875rem; color: var(--text-dim); text-align: center; margin-bottom: 2rem; }
    .auth-form { display: flex; flex-direction: column; gap: 1.1rem; }
    .auth-footer { margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-dim); }
    .auth-footer a { color: var(--orange); text-decoration: none; font-weight: 500; }
    .auth-error { background: rgba(220,53,69,0.08); border: 1px solid rgba(220,53,69,0.2); border-radius: var(--radius-sm); padding: 0.75rem 1rem; font-size: 0.85rem; color: #dc3545; display: none; }
    .auth-error.visible { display: block; }
    .btn-full { width: 100%; justify-content: center; }

    /* Role selector */
    .role-select-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    .role-option { position: relative; }
    .role-option input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .role-label {
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      padding: 1rem 0.75rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      text-align: center;
      cursor: none;
      transition: border-color 0.18s, background 0.18s;
    }
    .role-option input:checked + .role-label {
      border-color: var(--orange);
      background: rgba(240,90,34,0.06);
    }
    .role-label:hover { border-color: var(--border-strong); }
    .role-icon { font-size: 1.5rem; }
    .role-name { font-size: 0.8rem; font-weight: 600; color: var(--text); }
    .role-desc { font-size: 0.7rem; color: var(--text-faint); line-height: 1.4; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }
    .form-section-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-faint); margin-bottom: -0.25rem; }
    .terms-note { font-size: 0.75rem; color: var(--text-faint); text-align: center; line-height: 1.5; }
    .terms-note a { color: var(--orange); text-decoration: none; }
  </style>
</head>
<body>
<div class="cursor" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>

<div class="auth-card anim-fade-up-1">
  <div class="auth-logo">
    <a href="../index.html"><img src="../assets/images/logo.png" alt="Imali.biz"></a>
  </div>

  <h1 class="auth-title">Create your account</h1>
  <p class="auth-sub">Free forever. No listing fees. No subscription.</p>

  <div class="auth-error" id="auth-error" role="alert"></div>

  <form class="auth-form" id="register-form" novalidate>

    <!-- Step 1: Who are you? -->
    <div class="form-section-label">I want to</div>
    <div class="role-select-grid" role="group" aria-label="Select your primary role">
      <label class="role-option">
        <input type="radio" name="role" value="buyer" checked>
        <span class="role-label">
          <span class="role-icon">🏠</span>
          <span class="role-name">Buy</span>
          <span class="role-desc">Find land or property</span>
        </span>
      </label>
      <label class="role-option">
        <input type="radio" name="role" value="seller">
        <span class="role-label">
          <span class="role-icon">📋</span>
          <span class="role-name">Sell</span>
          <span class="role-desc">List land or property</span>
        </span>
      </label>
      <label class="role-option">
        <input type="radio" name="role" value="investor">
        <span class="role-label">
          <span class="role-icon">📈</span>
          <span class="role-name">Invest</span>
          <span class="role-desc">Grow my portfolio</span>
        </span>
      </label>
    </div>

    <!-- Personal details -->
    <div class="form-section-label" style="margin-top:0.5rem">Your details</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="first-name">First name</label>
        <input class="form-input" type="text" id="first-name" name="first_name" autocomplete="given-name" placeholder="Jean" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="last-name">Last name</label>
        <input class="form-input" type="text" id="last-name" name="last_name" autocomplete="family-name" placeholder="Mukiza" required>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="reg-email">Email address</label>
      <input class="form-input" type="email" id="reg-email" name="email" autocomplete="email" placeholder="you@example.com" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="phone">Phone number (Rwanda)</label>
      <input class="form-input" type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+250 7XX XXX XXX">
    </div>

    <div class="form-group">
      <label class="form-label" for="reg-password">Password</label>
      <input class="form-input" type="password" id="reg-password" name="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8">
    </div>

    <!-- TODO: Replace with real auth API -->
    <button type="submit" class="btn btn-primary btn-full">Create Free Account</button>

    <p class="terms-note">
      By creating an account you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </p>
  </form>

  <div class="auth-footer">
    Already have an account? <a href="login.html">Sign in</a>
  </div>
</div>

<div id="site-nav"></div>

<script src="../assets/js/core.js" data-root="../"></script>
<script>
  document.getElementById('register-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var errEl = document.getElementById('auth-error');
    var email = document.getElementById('reg-email').value.trim();
    var pass  = document.getElementById('reg-password').value;
    var first = document.getElementById('first-name').value.trim();

    if (!first || !email || !pass) {
      errEl.textContent = 'Please fill in all required fields.';
      errEl.classList.add('visible');
      return;
    }
    if (pass.length < 8) {
      errEl.textContent = 'Password must be at least 8 characters.';
      errEl.classList.add('visible');
      return;
    }

    /* TODO: replace with fetch('/api/auth/register', { method:'POST', body: JSON.stringify({...}) }) */
    errEl.textContent = 'Registration coming soon. Backend not connected yet.';
    errEl.classList.add('visible');
  });
</script>
</body>
</html>
