<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>(function(){var t=localStorage.getItem('imali-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Imali.biz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100svh; padding: 6rem 1.5rem 3rem; }
    .auth-card {
      width: 100%; max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-md);
    }
    .auth-logo { display: flex; justify-content: center; margin-bottom: 2rem; }
    .auth-logo img { height: 36px; width: auto; }
    .auth-title { font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 0.4rem; }
    .auth-sub { font-size: 0.875rem; color: var(--text-dim); text-align: center; margin-bottom: 2rem; }
    .auth-form { display: flex; flex-direction: column; gap: 1.1rem; }
    .auth-divider { display: flex; align-items: center; gap: 0.75rem; color: var(--text-faint); font-size: 0.78rem; margin: 0.25rem 0; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .auth-footer { margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-dim); }
    .auth-footer a { color: var(--orange); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { color: var(--orange-dark); }
    .auth-error { background: rgba(220,53,69,0.08); border: 1px solid rgba(220,53,69,0.2); border-radius: var(--radius-sm); padding: 0.75rem 1rem; font-size: 0.85rem; color: #dc3545; display: none; }
    .auth-error.visible { display: block; }
    .forgot-link { font-size: 0.8rem; color: var(--text-faint); text-align: right; text-decoration: none; }
    .forgot-link:hover { color: var(--orange); }
    .btn-full { width: 100%; justify-content: center; }
  </style>
</head>
<body>
<div class="cursor" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>

<div class="auth-card anim-fade-up-1">
  <div class="auth-logo">
    <a href="../index.html"><img src="../assets/images/logo.png" alt="Imali.biz"></a>
  </div>

  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-sub">Sign in to your Imali.biz account</p>

  <div class="auth-error" id="auth-error" role="alert"></div>

  <form class="auth-form" id="login-form" novalidate>
    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input class="form-input" type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="password" style="display:flex;justify-content:space-between;align-items:center">
        Password
        <a href="#" class="forgot-link">Forgot password?</a>
      </label>
      <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>

    <!-- TODO: Replace with real auth API call -->
    <button type="submit" class="btn btn-primary btn-full">Sign In</button>

    <div class="auth-divider">or</div>

    <!-- TODO: Add OAuth providers (Google, etc.) -->
    <button type="button" class="btn btn-outline btn-full" disabled style="opacity:0.5">
      Continue with Google (coming soon)
    </button>
  </form>

  <div class="auth-footer">
    Don't have an account? <a href="register.html">Create one free</a>
  </div>
</div>

<div id="site-nav"></div>

<script src="../assets/js/core.js" data-root="../"></script>
<script>
  /* ── Stub login handler ──
   * Replace this entire block with a real API call when backend is ready.
   * The API should return a user object; store it in localStorage and redirect.
   */
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var email    = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var errEl    = document.getElementById('auth-error');

    if (!email || !password) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.classList.add('visible');
      return;
    }

    /* TODO: replace with fetch('/api/auth/login', { method:'POST', body: JSON.stringify({email,password}) }) */
    errEl.textContent = 'Authentication coming soon. Backend not connected yet.';
    errEl.classList.add('visible');
  });

  /* Redirect if already logged in */
  if (localStorage.getItem('imali_user')) {
    window.location.href = '../auth/dashboard.html';
  }
</script>
</body>
</html>
