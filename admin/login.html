<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>(function(){var t=localStorage.getItem('imali-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Imali.biz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
<style>
* { box-sizing: border-box; }
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); margin: 0; padding: 1.5rem; }
.login-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2.75rem 2.5rem 2.25rem;
  width: min(420px, 100%);
  box-shadow: 0 8px 40px rgba(0,0,0,0.07);
}
.login-icon { font-size: 2.4rem; text-align: center; margin-bottom: 0.6rem; }
.login-title { font-family: var(--font-head), sans-serif; font-size: 1.45rem; font-weight: 800; text-align: center; letter-spacing: -0.03em; margin-bottom: 0.25rem; color: var(--text); }
.login-sub { font-size: 0.84rem; color: var(--text-dim); text-align: center; margin-bottom: 2rem; }
.fl { margin-bottom: 1.1rem; }
.fl label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.35rem; }
.fl input { width: 100%; padding: 0.72rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: var(--font-body), sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.15s; }
.fl input:focus { border-color: var(--green); }
.login-err { color: #ef5350; font-size: 0.82rem; min-height: 1.2rem; text-align: center; margin-bottom: 0.65rem; }
.login-btn { width: 100%; padding: 0.82rem; background: var(--green); border: none; border-radius: 10px; font-family: var(--font-head), sans-serif; font-weight: 700; font-size: 0.95rem; color: #fff; cursor: pointer; transition: opacity 0.15s; }
.login-btn:hover:not(:disabled) { opacity: 0.87; }
.login-btn:disabled { opacity: 0.55; cursor: not-allowed; }
.login-brand { text-align: center; margin-top: 1.5rem; font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-icon">🔐</div>
  <div class="login-title">Imali.biz Admin</div>
  <div class="login-sub">Sign in to manage listings.</div>

  <div class="fl">
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="your username">
  </div>
  <div class="fl">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
  </div>

  <div class="login-err" id="loginErr"></div>
  <button class="login-btn" id="loginBtn">Sign in</button>

  <div class="login-brand">IMALI.BIZ · ADMIN PANEL</div>
</div>

<script src="db.js"></script>
<script>
(function () {
  // Already logged in → skip
  var _sess = null;
  try { _sess = JSON.parse(localStorage.getItem('imali_admin_user') || 'null'); } catch (e) {}
  if (_sess && _sess.username) { window.location.replace('manage-listings.html'); return; }

  async function sha256(text) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  var uInp = document.getElementById('username');
  var pInp = document.getElementById('password');
  var btn  = document.getElementById('loginBtn');
  var err  = document.getElementById('loginErr');

  function setErr(msg) { err.textContent = msg || ''; }
  function setLoading(on) { btn.disabled = on; btn.textContent = on ? 'Signing in…' : 'Sign in'; }

  async function attempt() {
    setErr('');
    var username = (uInp.value || '').trim().toLowerCase();
    var password = pInp.value || '';
    if (!username) { setErr('Please enter your username.'); uInp.focus(); return; }
    if (!password) { setErr('Please enter your password.'); pInp.focus(); return; }
    setLoading(true);
    try {
      var hash = await sha256(password);
      var userData = await listingsDB.getAdminUser(username);
      if (!userData || userData.password_hash !== hash) {
        setErr('Incorrect username or password.');
        pInp.value = ''; setLoading(false); pInp.focus(); return;
      }
      localStorage.setItem('imali_admin_user', JSON.stringify({
        username:     userData.username,
        display_name: userData.display_name,
        initials:     userData.initials,
        role:         userData.role || 'editor',
      }));
      var _allowed = ['manage-listings.html', 'create-profile.html', 'add-listing.html'];
      var _next = new URLSearchParams(location.search).get('next') || '';
      window.location.replace(_allowed.includes(_next) ? _next : 'manage-listings.html');
    } catch (e) {
      setErr('Could not connect to database. Try again.');
      setLoading(false);
    }
  }

  btn.addEventListener('click', attempt);
  pInp.addEventListener('keydown', function (e) { if (e.key === 'Enter') attempt(); });
  uInp.addEventListener('keydown', function (e) { if (e.key === 'Enter') pInp.focus(); });

  listingsDB.ready.then(function () { uInp.focus(); }).catch(function () {
    setErr('Could not connect to database.');
  });
})();
</script>
</body>
</html>
